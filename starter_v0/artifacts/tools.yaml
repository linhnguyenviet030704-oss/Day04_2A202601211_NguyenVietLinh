tools:
  - name: clarify
    description: "Ask the user for missing information or explicit confirmation. Use when a tool call would require guessing a paper, URL, account, topic, or when an external action needs yes/no confirmation. Do not use for ordinary answerable questions."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Specific question to ask the user."}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Expected answer shape. Use yes_no before send/post/publish actions."}
        options: {type: array, default: [], items: {type: string}, description: "Choices when response_type is choice."}
      required: [question]

  - name: timeline
    description: "Get recent social posts from one known account handle. Use only when the user asks for posts/tweets from a specific person or account. Do not use for topic search, web news, or papers."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Account handle without @, e.g. sama or karpathy."}
        limit: {type: integer, default: 5, description: "Number of recent posts to return."}
      required: [screenname]

  - name: social_search
    description: "Search social posts by keyword or topic. Use for 'what are people saying about X' or top/latest posts about X. Do not use for a single account timeline, web search, or paper search."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Keyword/topic to search for."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Use Top for popular/top posts; use Latest for recent posts."}
        limit: {type: integer, default: 5, description: "Number of posts to return."}
      required: [query]

  - name: lookup
    description: "Search the public web for general information, news, project pages, benchmark pages, venue pages, blog posts, or non-paper sources. Use topic=news only for current/recent news. Do not use when the user gave a specific URL or asks for arXiv papers."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Web search query."}
        topic: {type: string, enum: [general, news], default: "general", description: "general for normal web search; news for current news."}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "News/general recency window when relevant."}
        max_results: {type: integer, default: 5, description: "Maximum results."}
      required: [query]

  - name: fetch
    description: "Read one specific URL supplied by the user or already found by another tool. Use to summarize, inspect, or extract from that exact page. Do not use for search."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Exact URL to read."}
      required: [url]

  - name: format
    description: "Format already collected items into markdown. Use only after items exist from other tools or the user supplies items. It does not search, fetch, or verify facts."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Items to format."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Output style."}
        headline: {type: string, default: "", description: "Optional heading."}
      required: [items, template]

  - name: send
    description: "Send text to the configured Telegram channel. Use only after the user has explicitly confirmed the exact text/action. If not confirmed, call clarify with response_type=yes_no first."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Text to send."}
        confirmed: {type: boolean, default: false, description: "Must be true only after explicit user confirmation."}
      required: [text]

  - name: policy
    description: "Search local company policy markdown. Use for questions about citation rules, source use, privacy, external publishing, AI research policy, or tool usage policy. Do not use for public web or paper search."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Policy search query."}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Policy area filter."}
        top_k: {type: integer, default: 3, description: "Number of policy sections."}
      required: [query]

  - name: papers
    description: "Search arXiv for scientific papers by topic, title, author, method, benchmark, or field. Use for finding papers, not for reading a known paper's full text. Use submittedDate for newest/recent; relevance for best match."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Paper search query."}
        max_results: {type: integer, default: 5, description: "Number of papers, clamped by implementation."}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sort mode: relevance, lastUpdatedDate, or submittedDate."}
      required: [query]

  - name: paper_text
    description: "Download and extract text from a known arXiv paper. Use only when the user provides an arXiv ID or arXiv URL and asks to read, summarize, inspect sections, or extract text. Do not use for paper discovery."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "arXiv ID or URL, e.g. 1706.03762 or https://arxiv.org/abs/1706.03762."}
        max_pages: {type: integer, default: 5, description: "Maximum PDF pages to read."}
        max_chars: {type: integer, default: 8000, description: "Maximum extracted characters returned."}
      required: [arxiv_url]

  - name: paper_code
    description: "Search public GitHub repositories related to a scientific paper. Use when the user asks for official code, implementation, reproduction repo, GitHub repo, or code for a paper/method. Do not use for citation or paper text."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Method, benchmark, task, or extra code-search terms."}
        paper_title: {type: string, default: "", description: "Paper title when known."}
        arxiv_id: {type: string, default: "", description: "arXiv ID when known."}
        max_results: {type: integer, default: 5, description: "Maximum repositories."}
      required: []

  - name: citation_lookup
    description: "Look up paper metadata, citation count, references count, influential citations, external IDs, or BibTeX via Semantic Scholar. Use paper_id when known; use query for title search. Do not use for reading PDF text."
    parameters:
      type: object
      properties:
        paper_id: {type: string, default: "", description: "arXiv ID, DOI, CorpusId, or Semantic Scholar paper ID."}
        query: {type: string, default: "", description: "Paper title or search query when paper_id is unknown."}
        max_results: {type: integer, default: 5, description: "Maximum papers when searching by query."}
      required: []

  - name: method_extract
    description: "Extract method, approach, model, experiment, evaluation, result, or limitation sections from paper text already available in context. Use after paper_text or user-provided text. It does not fetch PDFs."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Paper text to inspect."}
        section_keywords:
          type: array
          default: []
          items: {type: string}
          description: "Section keywords to extract; defaults cover method/experiment/result/limitation."
        max_chars: {type: integer, default: 4000, description: "Maximum characters per section."}
      required: [text]

  - name: rerank
    description: "Rerank an existing list of items against a research query. Use after papers, lookup, paper_code, or paper_text results when the user asks to prioritize, choose most relevant, filter top-k, or rank. It does not fetch new data."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Research need used for ranking."}
        items:
          type: array
          default: []
          description: "Existing items to rerank."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        top_k: {type: integer, default: 5, description: "Number of ranked items to return."}
      required: [query, items]
