# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm trên mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  # ---------------- Tool chất lượng nghiên cứu do nhóm tự viết ----------------
  - name: source_audit
    description: "Chỉ dùng khi đã có sẵn các nguồn và người dùng yêu cầu loại bỏ mục trùng, kiểm tra độ đầy đủ của trích dẫn hoặc đo mức độ đa dạng nguồn. Tool này chỉ kiểm tra cấu trúc tập bằng chứng; không tìm kiếm, đọc URL, xếp hạng độ tin cậy hoặc chứng minh thông tin đúng hay sai."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Danh sách nguồn đã có sẵn cần kiểm tra."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              date: {type: string}
        min_unique_sources: {type: integer, minimum: 1, maximum: 20, default: 2, description: "Số nhãn nguồn hoặc tên miền URL khác nhau tối thiểu; khác nhau không đồng nghĩa với độc lập."}
        require_urls: {type: boolean, default: true, description: "Báo lỗi đối với các mục không có URL HTTP(S) hợp lệ."}
        deduplicate: {type: boolean, default: true, description: "Loại các mục trùng URL hoặc tiêu đề khỏi audited_items."}
      required: [items]

  - name: citation_export
    description: "Chỉ dùng để chuyển metadata của các nguồn đã thu thập thành trích dẫn Markdown, kiểu APA hoặc BibTeX. Tool này không tìm nguồn, bổ sung metadata còn thiếu, lưu file hoặc xác minh tuyên bố."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Metadata của các nguồn đã có sẵn cần tạo trích dẫn."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              author: {type: string}
              authors:
                type: array
                items: {type: string}
              date: {type: string}
              published: {type: string}
              year: {type: string}
              doi: {type: string}
              journal: {type: string}
              publisher: {type: string}
        style: {type: string, enum: [markdown, apa, bibtex], default: "markdown", description: "Định dạng trích dẫn đầu ra."}
        deduplicate: {type: boolean, default: true, description: "Loại trích dẫn trùng URL, DOI hoặc tiêu đề sau khi chuẩn hóa."}
      required: [items]

  - name: compare_sources
    description: "Chỉ dùng khi đã có sẵn ít nhất hai nguồn và người dùng yêu cầu so sánh phần từ ngữ trùng nhau hoặc chủ đề riêng của từng nguồn. Độ tương đồng chỉ là bằng chứng từ vựng, không chứng minh đồng thuận ngữ nghĩa, phát hiện mâu thuẫn, xếp hạng độ tin cậy hoặc kiểm chứng sự thật."
    parameters:
      type: object
      properties:
        items:
          type: array
          minItems: 2
          description: "Ít nhất hai nguồn đã có sẵn, chứa tiêu đề và phần tóm tắt hoặc văn bản."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              content: {type: string}
              text: {type: string}
        max_terms: {type: integer, minimum: 1, maximum: 50, default: 10, description: "Số từ khóa chung hoặc riêng tối đa được trả về."}
      required: [items]

  - name: rss_search
    description: "Lấy và tìm bài từ các URL RSS/Atom cụ thể. Chỉ dùng để theo dõi feed; không dùng thay công cụ tìm kiếm web tổng quát và không tự đoán URL feed. Nếu thiếu URL feed, hãy gọi clarify."
    parameters:
      type: object
      properties:
        feed_urls:
          type: array
          minItems: 1
          maxItems: 10
          items: {type: string}
          description: "Các URL RSS hoặc Atom dùng HTTP(S) được cung cấp rõ ràng bởi người dùng hoặc ngữ cảnh hội thoại."
        query: {type: string, default: "", description: "Từ khóa tùy chọn để lọc theo tiêu đề và phần tóm tắt của bài."}
        max_results: {type: integer, minimum: 1, maximum: 25, default: 10, description: "Tổng số bài tối đa được trả về."}
      required: [feed_urls]

  - name: claim_extract
    description: "Chỉ dùng khi đã có sẵn văn bản và người dùng yêu cầu xác định các phát biểu có thể kiểm tra, số liệu, ngày tháng hoặc dấu hiệu quy nguồn. Kết quả chỉ là ứng viên được trích bằng heuristic, không phải sự thật đã được xác minh."
    parameters:
      type: object
      properties:
        text: {type: string, description: "Văn bản đã có sẵn dùng để trích xuất các ứng viên tuyên bố."}
        max_claims: {type: integer, minimum: 1, maximum: 50, default: 10, description: "Số ứng viên tuyên bố tối đa được trả về."}
      required: [text]
  - name: paper_code
    description: "Search public GitHub repositories related to a scientific paper. Use when the user asks for official code, implementation, reproduction repo, GitHub repo, or code for a paper/method. Do not use for citation or paper text."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Method, benchmark, task, or extra code-search terms."}
        paper_title: {type: string, default: "", description: "Paper title when known."}
        arxiv_id: {type: string, default: "", description: "arXiv ID when known."}
        max_results: {type: integer, default: 5, description: "Maximum repositories."}
      required: []

  - name: citation_lookup
    description: "Look up paper metadata, citation count, references count, influential citations, external IDs, or BibTeX via Semantic Scholar. Use paper_id when known; use query for title search. Do not use for reading PDF text."
    parameters:
      type: object
      properties:
        paper_id: {type: string, default: "", description: "arXiv ID, DOI, CorpusId, or Semantic Scholar paper ID."}
        query: {type: string, default: "", description: "Paper title or search query when paper_id is unknown."}
        max_results: {type: integer, default: 5, description: "Maximum papers when searching by query."}
      required: []

  - name: method_extract
    description: "Extract method, approach, model, experiment, evaluation, result, or limitation sections from paper text already available in context. Use after paper_text or user-provided text. It does not fetch PDFs."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Paper text to inspect."}
        section_keywords:
          type: array
          default: []
          items: {type: string}
          description: "Section keywords to extract; defaults cover method/experiment/result/limitation."
        max_chars: {type: integer, default: 4000, description: "Maximum characters per section."}
      required: [text]

  - name: rerank
    description: "Rerank an existing list of items against a research query. Use after papers, lookup, paper_code, or paper_text results when the user asks to prioritize, choose most relevant, filter top-k, or rank. It does not fetch new data."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Research need used for ranking."}
        items:
          type: array
          default: []
          description: "Existing items to rerank."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        top_k: {type: integer, default: 5, description: "Number of ranked items to return."}
      required: [query, items]
